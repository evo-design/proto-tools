data:
  name: the source registry and each record's contributors
  spdx: Custom (each record's source license; CC BY 4.0 or CC BY-SA 4.0 for most iGEM parts)
  url: https://registry.igem.org/
  text: SynBioHub registries host independently contributed records, and each record keeps the license its source assigns. Parts from the iGEM Registry of Standard Biological Parts carry a per-part license, most often CC BY 4.0 (the Registry's default) or CC BY-SA 4.0. Both permit redistribution with attribution, and CC BY-SA requires adaptations to keep the same license. Check a part's license on registry.igem.org before redistributing it.
  attribution_required: true
commercial_use: restricted
redistribution: true
