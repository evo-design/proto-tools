proto_tools_original: true
notes: The client performs live retrieval only and maintains no registry snapshot. Records keep their source licenses; iGEM parts are redistributable with attribution under CC BY 4.0 or CC BY-SA 4.0. commercial_use is restricted because records outside the iGEM collection may carry other terms.
