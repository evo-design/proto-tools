notes: 'FreeBindCraft (cytokineking/FreeBindCraft) and upstream BindCraft (martinpacesa/BindCraft) are MIT; ColabDesign (sokrypton/ColabDesign, pinned e31a56fe) is under the Beer-Ware License (Revision 42, Sergey Ovchinnikov) — permissive, permits commercial use, requires only retaining the notice. FreeBindCraft replaces PyRosetta with open-source tools — OpenMM (relaxation), FreeSASA + Biopython (surface analysis), and the sc-rs shape-complementarity binary — so the pipeline carries no PyRosetta license restriction and is safe for commercial hosting. The dominant weights are AlphaFold2 parameters (CC-BY-4.0, shared with the alphafold2 toolkit; attribution required). ProteinMPNN weights bundled via ColabDesign are MIT. These terms are for the FreeBindCraft commit setup.sh pins (d12747d, 2025-11-30), which is MIT, so code.url points at that commit''s LICENSE. Upstream moved to the Elastic License 2.0 in c1fcd0e5 (2026-11-19, alongside its tmol backend). That license forbids providing the software to third parties as a hosted or managed service, so moving the pin past that commit would end commercial hosting and needs these terms and the Modal deployment revisited.'
