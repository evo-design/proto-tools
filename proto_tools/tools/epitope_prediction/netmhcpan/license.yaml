  text: 'The networks and threshold tables are bundled in the software archive, so they are
    covered by the same gated academic license as the software and are obtained by the same
    request to DTU Health Tech after agreeing to its terms.'
notes: 'netMHCpan is proprietary precompiled software from DTU Health Tech, free only for
  publicly funded academic, education or research institutions and gated behind per-user
  registration; a commercial license must be obtained from health-software@dtu.dk. DTU''s
  download request form additionally requires an institutional e-mail address, which is a
  condition of the download process rather than a term of the agreement. The license is
  non-transferable and forbids giving the software to third parties alone or integrated into
  other software, so the archive is never redistributed with proto-tools and both tools are
  registered local_only and can never run on a remote or hosted worker. Modification of the
  source code is prohibited without DTU''s written consent, which is why the wrapper invokes
  the platform binary directly rather than editing the shipped tcsh launcher. Publishing
  results of benchmark tests run on the software to a third party requires prior written
  consent, so the tests assert structural and relational properties rather than committing
  score tables. Cite Nilsson et al. (2025).'
