notes: 'IgLM (Graylab/IgLM, Gray Lab at Johns Hopkins University) ships code and
  pre-trained weights under the JHU Academic Software License Agreement, which grants a
  non-exclusive, nontransferable license for non-commercial, non-profit purposes only;
  research use by for-profit entities counts as commercial use and needs a separately
  executed agreement, obtained through Johns Hopkins Technology Ventures at
  https://jhtv.e-lucid.com/product/generative-language-model-for-antibody-sequence-design-iglm.
  Redistribution in source and binary form is permitted as long as the copyright notice
  and terms are retained and third parties are required to adhere to the same terms.
  Acknowledgement of "© 2022 The Johns Hopkins University" and a citation of Shuai et al.
  (2023) in publications are required. Both checkpoints are bundled in the iglm wheel, so
  there is no gated download and no weights.access gate; the OAS95 training and test data
  are published separately at https://data.graylab.jhu.edu/OAS95.tar.gz.'
